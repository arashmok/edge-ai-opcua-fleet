# =============================================================================
# k3s manifests: OPC UA fleet gateway + MQTT pubsub agent stack
# Topology (ALWAYS CENTRALIZED):
#   - DGX Spark  = k3s server (control plane) + MQTT broker + OPC UA fleet gateway
#   - Raspberry Pi = k3s agent, physically wired to the robotic arm
#   - The Pi runs a pubsub_agent.py MQTT client that publishes state and receives commands
#   - A single OPC UA endpoint on the Spark models the whole fleet at opc.tcp://<spark>:4840/fleet/
#
# Prereqs (run once, see the guide for full steps):
#   Spark:  curl -sfL https://get.k3s.io | sh -          (installs k3s server)
#   Pi:     curl -sfL https://get.k3s.io | K3S_URL=... K3S_TOKEN=... sh -   (agent)
#   Label the nodes so workloads land on the right box:
#     kubectl label node <pi-hostname>    role=arm
#     kubectl label node <spark-hostname> role=edge
#
# Apply with:  kubectl apply -f k3s-opcua-stack.yaml
# To scale to additional robots: add robot ids to ROBOTS below (e.g. arm1,arm2,arm3)
# and deploy another pi-agent Deployment with a distinct ROBOT_ID (topology unchanged).
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: edge-opcua

---
# -----------------------------------------------------------------------------
# Shared config: MQTT broker, OPC UA fleet port, robot list, and timing.
# Edit these values to match your setup.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: opcua-config
  namespace: edge-opcua
data:
  # MQTT broker connection
  MQTT_HOST: "mqtt-broker"
  MQTT_PORT: "1883"
  # OPC UA fleet endpoint on the Spark
  OPCUA_PORT: "4840"
  # ROBOTS: comma-separated list of robot IDs (add more to scale, topology unchanged)
  ROBOTS: "arm1"
  # Joint names used by gateway and agents
  ARM_JOINTS: "base,pitch,reach,gripper"
  # ROS domain ID for bridge components
  ROS_DOMAIN_ID: "42"
  # Sampling interval in milliseconds
  SAMPLE_INTERVAL_MS: "100"

---
# =============================================================================
# MQTT BROKER - runs on the Spark (role=edge)
# Provides the pubsub transport for OPC UA Fleet connectivity.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-config
  namespace: edge-opcua
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: edge-opcua
  labels:
    app: mqtt-broker
    tier: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
        tier: broker
    spec:
      nodeSelector:
        role: edge                # pin to the Spark
      containers:
        - name: mqtt-broker
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: config-volume
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
      volumes:
        - name: config-volume
          configMap:
            name: mqtt-config

---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: edge-opcua
spec:
  selector:
    app: mqtt-broker
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883

---
# =============================================================================
# SPARK GATEWAY - OPC UA fleet endpoint on the Spark (role=edge)
# Hosts ONE OPC UA server representing the whole fleet at opc.tcp://<spark>:4840/fleet/
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-gateway
  namespace: edge-opcua
  labels:
    app: spark-gateway
    tier: gateway
spec:
  replicas: 1
  # hostNetwork + hostPort 4840 means two pods can't run at once on the node,
  # so a rolling update would deadlock; Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-gateway
  template:
    metadata:
      labels:
        app: spark-gateway
        tier: gateway
    spec:
      nodeSelector:
        role: edge                # pin to the Spark
      hostNetwork: true           # so OPC UA discovery and the OPC UA port work cleanly
      dnsPolicy: ClusterFirstWithHostNet   # keep cluster DNS so MQTT_HOST=mqtt-broker resolves
      containers:
        - name: spark-gateway
          image: your-registry/spark-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4840
          envFrom:
            - configMapRef:
                name: opcua-config

---
apiVersion: v1
kind: Service
metadata:
  name: spark-gateway
  namespace: edge-opcua
spec:
  selector:
    app: spark-gateway
  ports:
    - name: opcua
      port: 4840
      targetPort: 4840

---
# =============================================================================
# PI AGENT (pubsub_agent) - MQTT client on the Pi (role=arm)
# Publishes joint state to fleet/<robot_id>/state, subscribes to fleet/<robot_id>/cmd
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent
  namespace: edge-opcua
  labels:
    app: pi-agent
    tier: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pi-agent
  template:
    metadata:
      labels:
        app: pi-agent
        tier: agent
    spec:
      nodeSelector:
        role: arm                 # pin to the Pi
      # No hostNetwork: the agent only opens an outbound MQTT connection, so a
      # normal pod IP + cluster DNS is enough to resolve the mqtt-broker Service.
      # (GPIO access comes from privileged below, not from the host network.)
      containers:
        - name: pi-agent
          image: your-registry/pi-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: opcua-config
          env:
            - name: ROBOT_ID
              value: "arm1"
          securityContext:
            privileged: true      # gives lgpio access to the host /dev/gpiochip* devices

---
# =============================================================================
# Optional ROS 2 <-> OPC UA Bridge
# Translates ROS 2 topics/services to OPC UA nodes and back.
# Adjust OPCUA_ENDPOINT to point at the spark-gateway fleet endpoint.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ros2-opcua-bridge
  namespace: edge-opcua
  labels:
    app: ros2-opcua-bridge
    tier: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ros2-opcua-bridge
  template:
    metadata:
      labels:
        app: ros2-opcua-bridge
        tier: bridge
    spec:
      nodeSelector:
        role: edge                # co-locate with the gateway on the Spark
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet   # keep cluster DNS while on host net
      containers:
        - name: ros2-opcua-bridge
          image: your-registry/ros2-opcua-bridge:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OPCUA_ENDPOINT
              value: "opc.tcp://spark-gateway.edge-opcua.svc.cluster.local:4840/fleet/"
            - name: OPCUA_SECURITY
              value: "None"
            - name: ROS_DOMAIN_ID
              valueFrom:
                configMapKeyRef:
                  name: opcua-config
                  key: ROS_DOMAIN_ID

---
# =============================================================================
# Optional AI results server (exposes ROS inference results via OPC UA)
# Adjust OPCUA_ENDPOINT to point at the spark-gateway fleet endpoint.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opcua-ai-results-server
  namespace: edge-opcua
  labels:
    app: opcua-ai-results-server
    tier: edge-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opcua-ai-results-server
  template:
    metadata:
      labels:
        app: opcua-ai-results-server
        tier: edge-ai
    spec:
      nodeSelector:
        role: edge
      hostNetwork: true
      containers:
        - name: opcua-ai-results-server
          image: your-registry/opcua-ai-results-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4841
          env:
            - name: OPCUA_BIND_PORT
              value: "4841"
            - name: OPCUA_ENDPOINT
              value: "opc.tcp://spark-gateway.edge-opcua.svc.cluster.local:4840/fleet/"

---
apiVersion: v1
kind: Service
metadata:
  name: opcua-ai-results-server
  namespace: edge-opcua
spec:
  selector:
    app: opcua-ai-results-server
  ports:
    - name: opcua
      port: 4841
      targetPort: 4841
